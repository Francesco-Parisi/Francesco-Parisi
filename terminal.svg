<title id="title">whoami — Francesco Parisi</title>
<desc id="desc">Animated terminal. Hi there, I&#x27;m Francesco. Cybersecurity analyst focused on OSINT and Cyber Threat Intelligence: digital exposure across surface, deep and dark web, leaked credentials, phishing domains and IoCs. Code: Python, C, Java, JavaScript, MongoDB. MSc and BSc in Computer Science at the University of Salerno, cloud computing. Offline: building PCs and consoles, science and fiction books, outdoor sports.</desc>

