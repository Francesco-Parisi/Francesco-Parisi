  @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes show { from { opacity: 0; } to { opacity: 1; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
