<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="20" viewBox="0 0 1000 20" role="img" aria-labelledby="title desc" >
<title id="title">Divider</title>
<desc id="desc">Decorative divider</desc>
<defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#4cc2ff" stop-opacity="0"/><stop offset=".85" stop-color="#4cc2ff" stop-opacity=".9"/><stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/></linearGradient></defs>
<style>.pulse { animation: run 4s cubic-bezier(.5,0,.5,1) infinite; } @keyframes run { from { transform: translateX(-200px); } to { transform: translateX(1000px); } } @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<path d="M8 10H992" stroke="#213040"/>
<path d="M2 10l5-4 5 4-5 4z M988 10l5-4 5 4-5 4z" fill="#4cc2ff" fill-opacity=".8"/>
<rect class="pulse" x="0" y="9" width="200" height="2" fill="url(#p)"/>
</svg>