name: Language spectrum

on:
  schedule:
    - cron: "17 4 * * *"   # ogni giorno alle 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/lang_spectrum.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate assets/languages.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          TOP: "8"
          EXCLUDE: ""          # es. "Jupyter Notebook,ShaderLab"
        run: python scripts/lang_spectrum.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --cached --quiet || (git commit -m "chore: update language spectrum" && git push)
